<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>GURMAO – Restaurace</title>
  <meta name="description" content="Ne všechny restaurace. Jen ty, které mají důvod existovat. Vybrané gastro zažitky." />
  <meta property="og:title" content="GURMAO Restaurace" />
  <meta property="og:description" content="Ne všechny. Jen ty, které mají důvod existovat." />
  <meta property="og:type" content="website" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gurmaoblack: '#0b0b0d',
            gurmaogold: '#d4af37',
            gurmaored: '#8b1d18',
          },
          boxShadow: { glow: '0 0 40px rgba(212,175,55,0.35)' }
        }
      }
    }
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <!-- Tooltip Styles -->
  <link rel="stylesheet" href="tooltip.css">
  
  <style>
    body { font-family: 'Inter', sans-serif; }
    h1,h2,h3 { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="bg-gurmaoblack text-white overflow-x-hidden">

<!-- HEADER -->
<header class="sticky top-0 z-50 bg-gurmaoblack/80 backdrop-blur border-b border-white/10">
  <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
    <a href="index.html" class="text-2xl font-bold tracking-tight">GUR<span class="text-gurmaogold">M</span>AO</a>
    <nav class="hidden md:flex gap-6 text-sm">
      <a href="feed.html" class="hover:text-gurmaogold">Feed</a>
      <a href="restaurace.html" class="text-gurmaogold">Restaurace</a>
      <a href="kuchar.html" class="hover:text-gurmaogold">Kuchaři</a>
      <a href="gear.html" class="hover:text-gurmaogold">Gear</a>
      <a href="ai.html" class="hover:text-gurmaogold">AI</a>
      <a href="mapa.html" class="hover:text-gurmaogold">Mapa</a>
      <a href="collections.html" class="hover:text-gurmaogold">Můj výběr</a>
    </nav>
    <button id="menuBtn" class="md:hidden w-11 h-11 rounded-full bg-white/5 border border-white/15 hover:border-gurmaogold hover:text-gurmaogold transition" aria-label="Otevřít menu">☰</button>
  </div>
</header>

<!-- Mobile menu (outside header for proper z-index) -->
<div id="menuBackdrop" class="hidden md:hidden fixed inset-0 bg-black/70 z-[100]"></div>
<div id="mobileMenu" class="hidden md:hidden fixed inset-x-0 top-[65px] bottom-0 z-[110] overflow-y-auto">
  <div class="mx-4 my-4 rounded-3xl border border-white/10 bg-gurmaoblack/95 backdrop-blur p-4">
    <div class="flex items-center justify-between px-2 pb-3">
      <div class="text-sm text-white/60">Navigace</div>
      <button id="menuClose" class="w-10 h-10 rounded-full bg-white/5 border border-white/15 hover:border-gurmaogold hover:text-gurmaogold transition" aria-label="Zavřít menu">✕</button>
    </div>
    <nav class="grid gap-2">
      <a href="index.html" class="px-4 py-3 rounded-2xl bg-white/5 hover:bg-white/10">Domů</a>
      <a href="feed.html" class="px-4 py-3 rounded-2xl bg-white/5 hover:bg-white/10">Feed</a>
      <a href="restaurace.html" class="px-4 py-3 rounded-2xl bg-white/5 hover:bg-white/10">Restaurace</a>
      <a href="kuchar.html" class="px-4 py-3 rounded-2xl bg-white/5 hover:bg-white/10">Kuchaři</a>
      <a href="gear.html" class="px-4 py-3 rounded-2xl bg-white/5 hover:bg-white/10">Gear</a>
      <a href="ai.html" class="px-4 py-3 rounded-2xl bg-white/5 hover:bg-white/10">AI</a>
      <a href="collections.html" class="px-4 py-3 rounded-2xl bg-white/5 hover:bg-white/10">Sbírky</a>
      <a href="login.html" class="px-4 py-3 rounded-2xl border border-white/20 hover:border-gurmaogold hover:text-gurmaogold">Přihlásit se</a>
    </nav>
  </div>
</div>

<!-- HERO -->
<section class="py-20 border-b border-white/10">
  <div class="max-w-6xl mx-auto px-6">
    <h1 class="text-5xl md:text-6xl mb-6">Restaurace</h1>
    <p class="text-white/70 max-w-xl">
      Ne všechny. Jen ty, které mají důvod existovat.
    </p>
  </div>
</section>

<!-- SEARCH & FILTERS -->
<section class="py-10 border-b border-white/10">
  <div class="max-w-6xl mx-auto px-6">
    <!-- Search Box with Location -->
    <div class="mb-6 flex gap-3">
      <input 
        type="text" 
        id="searchInput" 
        placeholder="Hledat podle města nebo názvu restaurace..." 
        class="flex-1 px-6 py-4 rounded-2xl bg-white/5 border border-white/15 text-white placeholder-white/40 focus:border-gurmaogold focus:outline-none transition"
      />
      <button 
        id="locationBtn" 
        class="px-6 py-4 rounded-2xl bg-white/5 border border-white/15 hover:border-gurmaogold hover:bg-gurmaogold hover:text-black transition flex items-center gap-2 whitespace-nowrap"
        title="Najít nejbližší restaurace"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
        <span class="hidden md:inline">Blízko mě</span>
      </button>
    </div>
    
    <!-- Vibe Filters -->
    <div id="filters" class="flex flex-wrap gap-4 mb-4">
      <button class="px-5 py-2 rounded-full bg-gurmaogold text-black transition">Vše</button>
      <button class="vibe-tooltip px-5 py-2 rounded-full bg-white/5 hover:bg-gurmaogold hover:text-black transition" data-tooltip="Elegantní zážitek, důraz na detail, klidná atmosféra">🍷 LUXE</button>
      <button class="vibe-tooltip px-5 py-2 rounded-full bg-white/5 hover:bg-gurmaogold hover:text-black transition" data-tooltip="Výrazné chutě, silná osobnost, nezapomenutelné kombinace">🔥 DRAMA</button>
      <button class="vibe-tooltip px-5 py-2 rounded-full bg-white/5 hover:bg-gurmaogold hover:text-black transition" data-tooltip="Uvolněný styl, pestrost, radost z jídla bez pravidel">🌮 CHAOS</button>
      <button class="vibe-tooltip px-5 py-2 rounded-full bg-white/5 hover:bg-gurmaogold hover:text-black transition" data-tooltip="Čisté suroviny, jednoduchost, chuť v hlavní roli">🌿 PURE</button>
      <button class="vibe-tooltip px-5 py-2 rounded-full bg-white/5 hover:bg-gurmaogold hover:text-black transition" data-tooltip="Intimní atmosféra, večerní vibe, tlumené světlo">🖤 DARK</button>
    </div>
    
    <!-- Display Options -->
    <div class="flex items-center gap-2 text-sm">
      <span class="text-white/60">Zobrazit:</span>
      <button class="per-page-btn px-4 py-2 rounded-full bg-gurmaogold text-black transition" data-count="12">12</button>
      <button class="per-page-btn px-4 py-2 rounded-full bg-white/5 hover:bg-gurmaogold hover:text-black transition" data-count="24">24</button>
      <button class="per-page-btn px-4 py-2 rounded-full bg-white/5 hover:bg-gurmaogold hover:text-black transition" data-count="48">48</button>
    </div>
    <div id="resultCount" class="text-sm text-white/60 mt-2"></div>
  </div>
</section>

<!-- LIST -->
<section class="py-20">
  <div id="restaurantsList" class="max-w-6xl mx-auto px-6 grid md:grid-cols-3 gap-10">
    <!-- Restaurants will be loaded here dynamically -->
  </div>
</section>

<!-- FOOTER -->
<footer class="py-10 border-t border-white/10 text-center text-sm text-white/40">
  © 2025 GURMAO.cz · Nejez. Prožij.
</footer>

<script src="app.js"></script>
<script src="auth-ui.js"></script>
<script src="social-share.js"></script>
<script src="rating.js"></script>
<script type="module" src="restaurace.js"></script>

<!-- Vibe Tooltips -->
<script src="vibe-tooltips.js"></script>

</body>
</html>
