<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background -->
  <rect width="1200" height="630" fill="#0b0b0d"/>
  
  <!-- Gradient overlay -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#0b0b0d;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>
  
  <!-- Logo M -->
  <text x="600" y="250" font-family="Playfair Display, serif" font-size="200" font-weight="700" fill="#d4af37" text-anchor="middle">M</text>
  
  <!-- GURMAO text -->
  <text x="600" y="350" font-family="Playfair Display, serif" font-size="72" font-weight="600" fill="#ffffff" text-anchor="middle">GURMAO</text>
  
  <!-- Tagline -->
  <text x="600" y="420" font-family="Inter, sans-serif" font-size="36" font-weight="300" fill="#d4af37" text-anchor="middle">Nejez. Prožij.</text>
  
  <!-- URL -->
  <text x="600" y="520" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="#ffffff" fill-opacity="0.6" text-anchor="middle">gurmao.cz</text>
</svg>
