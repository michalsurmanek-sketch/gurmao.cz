<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Offline - GURMAO</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      background: #0b0b0d;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    
    .container {
      max-width: 500px;
    }
    
    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      font-family: 'Playfair Display', serif;
    }
    
    .logo {
      font-size: 3rem;
      margin-bottom: 2rem;
    }
    
    .gold {
      color: #d4af37;
    }
    
    p {
      font-size: 1.125rem;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    
    button {
      padding: 1rem 2rem;
      background: #d4af37;
      color: #0b0b0d;
      border: none;
      border-radius: 9999px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 40px rgba(212, 175, 55, 0.35);
    }
    
    .offline-icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="offline-icon">📡</div>
    
    <div class="logo">
      GUR<span class="gold">M</span>AO
    </div>
    
    <h1>Nejste připojeni k internetu</h1>
    
    <p>
      Pro zobrazení obsahu potřebujete aktivní připojení k internetu.
      Zkontrolujte prosím vaše připojení a zkuste to znovu.
    </p>
    
    <button onclick="window.location.reload()">
      Zkusit znovu
    </button>
    
    <p style="margin-top: 2rem; font-size: 0.875rem; color: rgba(255, 255, 255, 0.4);">
      Některé dříve navštívené stránky mohou být dostupné offline.
    </p>
  </div>
  
  <script>
    // Automaticky zkusit znovu, když se objeví připojení
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
