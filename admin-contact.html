<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="robots" content="noindex, nofollow">
  
  <title>Správa zpráv – Admin Panel – GURMAO</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gurmaoblack: '#0b0b0d',
            gurmaogold: '#d4af37',
            gurmaored: '#8b1d18',
          },
          boxShadow: { glow: '0 0 40px rgba(212,175,55,0.35)' }
        }
      }
    }
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="toast.css">
  
  <style>
    body { font-family: 'Inter', sans-serif; }
    h1,h2,h3 { font-family: 'Playfair Display', serif; }
    
    .message-card {
      transition: all 0.2s;
    }
    
    .message-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.2);
    }
    
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 500;
    }
    
    .status-new {
      background: rgba(212, 175, 55, 0.2);
      color: #d4af37;
    }
    
    .status-in_progress {
      background: rgba(59, 130, 246, 0.2);
      color: #3b82f6;
    }
    
    .status-resolved {
      background: rgba(34, 197, 94, 0.2);
      color: #22c55e;
    }
    
    .status-spam {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
    }
    
    .filter-btn {
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-weight: 500;
      transition: all 0.2s;
      border: 2px solid transparent;
    }
    
    .filter-btn:hover {
      border-color: rgba(212, 175, 55, 0.5);
    }
    
    .filter-btn.active {
      background: rgba(212, 175, 55, 0.2);
      border-color: #d4af37;
      color: #d4af37;
    }
  </style>
</head>

<body class="bg-gurmaoblack text-gray-100 min-h-screen">
  <!-- Admin Guard -->
  <script src="admin-guard.js"></script>
  
  <!-- Toast Container -->
  <div id="toast-container"></div>
  
  <!-- Header -->
  <header class="bg-gradient-to-r from-gurmaoblack to-gray-900 border-b border-gurmaogold/20 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-4">
          <a href="admin.html" class="text-gurmaogold hover:text-yellow-300 transition">
            ← Zpět do admin panelu
          </a>
          <h1 class="text-2xl font-bold text-gurmaogold">📬 Správa zpráv</h1>
        </div>
        <div class="flex items-center gap-3">
          <button id="refreshBtn" class="px-4 py-2 bg-gurmaogold/20 hover:bg-gurmaogold/30 rounded-lg transition">
            🔄 Obnovit
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 py-8 sm:px-6">
    
    <!-- Stats & Filters -->
    <div class="mb-8 space-y-4">
      <!-- Stats -->
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div class="bg-gray-900 border border-gurmaogold/20 rounded-xl p-6">
          <div class="text-sm text-gray-400 mb-1">Celkem zpráv</div>
          <div class="text-3xl font-bold text-gurmaogold" id="stat-total">0</div>
        </div>
        <div class="bg-gray-900 border border-gurmaogold/20 rounded-xl p-6">
          <div class="text-sm text-gray-400 mb-1">Nové</div>
          <div class="text-3xl font-bold text-yellow-400" id="stat-new">0</div>
        </div>
        <div class="bg-gray-900 border border-gurmaogold/20 rounded-xl p-6">
          <div class="text-sm text-gray-400 mb-1">Zpracovávané</div>
          <div class="text-3xl font-bold text-blue-400" id="stat-progress">0</div>
        </div>
        <div class="bg-gray-900 border border-gurmaogold/20 rounded-xl p-6">
          <div class="text-sm text-gray-400 mb-1">Vyřízené</div>
          <div class="text-3xl font-bold text-green-400" id="stat-resolved">0</div>
        </div>
      </div>

      <!-- Filters -->
      <div class="flex flex-wrap gap-3">
        <button class="filter-btn active" data-filter="all">
          Všechny (<span id="count-all">0</span>)
        </button>
        <button class="filter-btn" data-filter="new">
          🆕 Nové (<span id="count-new">0</span>)
        </button>
        <button class="filter-btn" data-filter="in_progress">
          ⏳ Zpracovávané (<span id="count-progress">0</span>)
        </button>
        <button class="filter-btn" data-filter="resolved">
          ✅ Vyřízené (<span id="count-resolved">0</span>)
        </button>
        <button class="filter-btn" data-filter="spam">
          🚫 Spam (<span id="count-spam">0</span>)
        </button>
      </div>
    </div>

    <!-- Messages List -->
    <div id="messagesList" class="space-y-4">
      <!-- Loading -->
      <div id="loading" class="text-center py-12">
        <div class="text-gurmaogold text-xl">Načítám zprávy...</div>
      </div>
      
      <!-- Empty State -->
      <div id="emptyState" class="hidden text-center py-12">
        <div class="text-gray-400 text-xl">Žádné zprávy</div>
      </div>
    </div>

  </main>

  <!-- Message Detail Modal -->
  <div id="messageModal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
    <div class="bg-gray-900 border border-gurmaogold/30 rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
      <div class="p-6">
        <!-- Header -->
        <div class="flex items-start justify-between mb-6">
          <div class="flex-1">
            <div class="flex items-center gap-3 mb-2">
              <h2 class="text-2xl font-bold text-gurmaogold" id="modal-subject"></h2>
              <span id="modal-status-badge"></span>
            </div>
            <div class="text-sm text-gray-400">
              <span id="modal-name"></span> • 
              <a id="modal-email" href="" class="text-gurmaogold hover:underline"></a>
            </div>
            <div class="text-xs text-gray-500 mt-1" id="modal-date"></div>
          </div>
          <button id="closeModal" class="text-gray-400 hover:text-white text-2xl">×</button>
        </div>

        <!-- Message -->
        <div class="bg-gurmaoblack/50 rounded-xl p-6 mb-6">
          <div class="text-gray-100 whitespace-pre-wrap" id="modal-message"></div>
        </div>

        <!-- Actions -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
          <button class="status-action px-4 py-3 bg-yellow-500/20 hover:bg-yellow-500/30 text-yellow-400 rounded-lg transition font-medium" data-status="new">
            🆕 Nová
          </button>
          <button class="status-action px-4 py-3 bg-blue-500/20 hover:bg-blue-500/30 text-blue-400 rounded-lg transition font-medium" data-status="in_progress">
            ⏳ Zpracovávám
          </button>
          <button class="status-action px-4 py-3 bg-green-500/20 hover:bg-green-500/30 text-green-400 rounded-lg transition font-medium" data-status="resolved">
            ✅ Vyřízeno
          </button>
          <button class="status-action px-4 py-3 bg-red-500/20 hover:bg-red-500/30 text-red-400 rounded-lg transition font-medium" data-status="spam">
            🚫 Spam
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="toast.js"></script>
  <script type="module">
    import { getContactMessages, updateContactMessageStatus } from './supabase-client.js';

    let allMessages = [];
    let currentFilter = 'all';
    let currentMessageId = null;

    // Load messages
    async function loadMessages() {
      try {
        document.getElementById('loading').classList.remove('hidden');
        document.getElementById('emptyState').classList.add('hidden');
        
        allMessages = await getContactMessages();
        
        // Sort by date (newest first)
        allMessages.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
        
        updateStats();
        renderMessages();
        
      } catch (error) {
        console.error('Error loading messages:', error);
        window.toast?.show('❌ Chyba při načítání zpráv', 'error');
      } finally {
        document.getElementById('loading').classList.add('hidden');
      }
    }

    // Update stats
    function updateStats() {
      const stats = {
        total: allMessages.length,
        new: allMessages.filter(m => m.status === 'new').length,
        in_progress: allMessages.filter(m => m.status === 'in_progress').length,
        resolved: allMessages.filter(m => m.status === 'resolved').length,
        spam: allMessages.filter(m => m.status === 'spam').length
      };

      document.getElementById('stat-total').textContent = stats.total;
      document.getElementById('stat-new').textContent = stats.new;
      document.getElementById('stat-progress').textContent = stats.in_progress;
      document.getElementById('stat-resolved').textContent = stats.resolved;

      document.getElementById('count-all').textContent = stats.total;
      document.getElementById('count-new').textContent = stats.new;
      document.getElementById('count-progress').textContent = stats.in_progress;
      document.getElementById('count-resolved').textContent = stats.resolved;
      document.getElementById('count-spam').textContent = stats.spam;
    }

    // Render messages
    function renderMessages() {
      const container = document.getElementById('messagesList');
      const filtered = currentFilter === 'all' 
        ? allMessages 
        : allMessages.filter(m => m.status === currentFilter);

      if (filtered.length === 0) {
        container.innerHTML = '<div class="text-center py-12 text-gray-400">Žádné zprávy v této kategorii</div>';
        return;
      }

      container.innerHTML = filtered.map(msg => `
        <div class="message-card bg-gray-900 border border-gurmaogold/20 rounded-xl p-6 cursor-pointer" data-id="${msg.id}">
          <div class="flex items-start justify-between gap-4">
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-3 mb-2">
                <h3 class="text-lg font-semibold text-gurmaogold truncate">${escapeHtml(msg.subject)}</h3>
                ${getStatusBadge(msg.status)}
              </div>
              <div class="text-sm text-gray-300 mb-2">
                <span class="font-medium">${escapeHtml(msg.name)}</span> • 
                <span class="text-gray-400">${escapeHtml(msg.email)}</span>
              </div>
              <div class="text-gray-400 text-sm line-clamp-2">${escapeHtml(msg.message)}</div>
            </div>
            <div class="text-xs text-gray-500 whitespace-nowrap">
              ${formatDate(msg.created_at)}
            </div>
          </div>
        </div>
      `).join('');

      // Add click handlers
      container.querySelectorAll('.message-card').forEach(card => {
        card.addEventListener('click', () => {
          const id = card.dataset.id;
          showMessageDetail(id);
        });
      });
    }

    // Show message detail
    function showMessageDetail(messageId) {
      const msg = allMessages.find(m => m.id === messageId);
      if (!msg) return;

      currentMessageId = messageId;

      document.getElementById('modal-subject').textContent = msg.subject;
      document.getElementById('modal-name').textContent = msg.name;
      document.getElementById('modal-email').textContent = msg.email;
      document.getElementById('modal-email').href = `mailto:${msg.email}`;
      document.getElementById('modal-message').textContent = msg.message;
      document.getElementById('modal-date').textContent = formatDateLong(msg.created_at);
      document.getElementById('modal-status-badge').innerHTML = getStatusBadge(msg.status);

      // Highlight current status button
      document.querySelectorAll('.status-action').forEach(btn => {
        if (btn.dataset.status === msg.status) {
          btn.style.opacity = '1';
          btn.style.fontWeight = '700';
        } else {
          btn.style.opacity = '0.7';
          btn.style.fontWeight = '500';
        }
      });

      document.getElementById('messageModal').classList.remove('hidden');
    }

    // Close modal
    function closeModal() {
      document.getElementById('messageModal').classList.add('hidden');
      currentMessageId = null;
    }

    // Update message status
    async function updateStatus(status) {
      if (!currentMessageId) return;

      try {
        await updateContactMessageStatus(currentMessageId, status);
        
        // Update local data
        const msg = allMessages.find(m => m.id === currentMessageId);
        if (msg) {
          msg.status = status;
        }

        updateStats();
        renderMessages();
        closeModal();
        
        window.toast?.show('✅ Status aktualizován', 'success');
      } catch (error) {
        console.error('Error updating status:', error);
        window.toast?.show('❌ Chyba při aktualizaci statusu', 'error');
      }
    }

    // Helper functions
    function getStatusBadge(status) {
      const badges = {
        new: '<span class="status-badge status-new">🆕 Nová</span>',
        in_progress: '<span class="status-badge status-in_progress">⏳ Zpracovává se</span>',
        resolved: '<span class="status-badge status-resolved">✅ Vyřízeno</span>',
        spam: '<span class="status-badge status-spam">🚫 Spam</span>'
      };
      return badges[status] || badges.new;
    }

    function formatDate(dateString) {
      const date = new Date(dateString);
      const now = new Date();
      const diff = now - date;
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      
      if (days === 0) return 'Dnes';
      if (days === 1) return 'Včera';
      if (days < 7) return `Před ${days} dny`;
      
      return date.toLocaleDateString('cs-CZ', { day: 'numeric', month: 'short' });
    }

    function formatDateLong(dateString) {
      const date = new Date(dateString);
      return date.toLocaleDateString('cs-CZ', { 
        day: 'numeric', 
        month: 'long', 
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Event listeners
    document.getElementById('refreshBtn').addEventListener('click', loadMessages);
    document.getElementById('closeModal').addEventListener('click', closeModal);
    
    // Click outside modal to close
    document.getElementById('messageModal').addEventListener('click', (e) => {
      if (e.target.id === 'messageModal') closeModal();
    });

    // Filter buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentFilter = btn.dataset.filter;
        
        // Update active state
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        renderMessages();
      });
    });

    // Status action buttons
    document.querySelectorAll('.status-action').forEach(btn => {
      btn.addEventListener('click', () => {
        updateStatus(btn.dataset.status);
      });
    });

    // Initial load
    loadMessages();
  </script>
</body>
</html>
