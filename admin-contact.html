<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="robots" content="noindex, nofollow">
  
  <title>Správa zpráv – Admin Panel – GURMAO</title>

  <link rel="stylesheet" href="tailwind.min.css">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="toast.css">
  
  <style>
    body { 
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0b0b0d 0%, #1a1a1f 100%);
    }
    h1,h2,h3 { font-family: 'Playfair Display', serif; }
    
    .message-card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    
    .message-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: linear-gradient(180deg, #d4af37 0%, rgba(212, 175, 55, 0.3) 100%);
      opacity: 0;
      transition: opacity 0.3s;
    }
    
    .message-card:hover::before {
      opacity: 1;
    }
    
    .message-card:hover {
      transform: translateX(4px) translateY(-2px);
      box-shadow: 0 8px 24px rgba(212, 175, 55, 0.25);
      border-color: rgba(212, 175, 55, 0.4);
    }
    
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.375rem 1rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }
    
    .status-new {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.25) 0%, rgba(212, 175, 55, 0.15) 100%);
      color: #d4af37;
      border: 1px solid rgba(212, 175, 55, 0.3);
      animation: pulse-gold 2s ease-in-out infinite;
    }
    
    @keyframes pulse-gold {
      0%, 100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4); }
      50% { box-shadow: 0 0 0 8px rgba(212, 175, 55, 0); }
    }
    
    .status-in_progress {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.25) 0%, rgba(59, 130, 246, 0.15) 100%);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }
    
    .status-resolved {
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.25) 0%, rgba(34, 197, 94, 0.15) 100%);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    
    .status-spam {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.25) 0%, rgba(239, 68, 68, 0.15) 100%);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    
    .filter-btn {
      padding: 0.625rem 1.25rem;
      border-radius: 0.75rem;
      font-weight: 600;
      font-size: 0.875rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: 2px solid transparent;
      background: rgba(255, 255, 255, 0.03);
      position: relative;
      overflow: hidden;
    }
    
    .filter-btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(212, 175, 55, 0.1);
      transform: translate(-50%, -50%);
      transition: width 0.4s, height 0.4s;
    }
    
    .filter-btn:hover::before {
      width: 300px;
      height: 300px;
    }
    
    .filter-btn:hover {
      border-color: rgba(212, 175, 55, 0.5);
      background: rgba(212, 175, 55, 0.05);
      transform: translateY(-2px);
    }
    
    .filter-btn.active {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.25) 0%, rgba(212, 175, 55, 0.15) 100%);
      border-color: #d4af37;
      color: #d4af37;
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
    }
    
    .stat-card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.02) 100%);
      backdrop-filter: blur(10px);
      transition: all 0.3s;
    }
    
    .stat-card:hover {
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.1) 0%, rgba(212, 175, 55, 0.05) 100%);
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(212, 175, 55, 0.2);
    }
    
    .message-text {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-clamp: 2;
    }
    
    /* Notification Bell */
    .notification-bell {
      position: relative;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .notification-bell:hover {
      transform: scale(1.1) rotate(15deg);
    }
    
    .notification-badge {
      position: absolute;
      top: -8px;
      right: -8px;
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: white;
      border-radius: 9999px;
      min-width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0 6px;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.6);
      animation: pulse-notification 2s ease-in-out infinite;
      border: 2px solid #0b0b0d;
    }
    
    @keyframes pulse-notification {
      0%, 100% { 
        box-shadow: 0 0 12px rgba(239, 68, 68, 0.6);
        transform: scale(1);
      }
      50% { 
        box-shadow: 0 0 20px rgba(239, 68, 68, 0.9);
        transform: scale(1.1);
      }
    }
    
    .notification-panel {
      position: absolute;
      top: calc(100% + 1rem);
      right: 0;
      width: 400px;
      max-width: 90vw;
      max-height: 500px;
      overflow-y: auto;
      background: linear-gradient(135deg, #1a1a1f 0%, #0b0b0d 100%);
      border: 2px solid rgba(212, 175, 55, 0.3);
      border-radius: 1rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(212, 175, 55, 0.2);
      opacity: 0;
      transform: translateY(-10px);
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1000;
    }
    
    .notification-panel.active {
      opacity: 1;
      transform: translateY(0);
      pointer-events: all;
    }
    
    .notification-item {
      padding: 1rem;
      border-bottom: 1px solid rgba(212, 175, 55, 0.1);
      transition: all 0.2s;
      cursor: pointer;
    }
    
    .notification-item:hover {
      background: rgba(212, 175, 55, 0.1);
    }
    
    .notification-item:last-child {
      border-bottom: none;
    }
    html:not(.admin-authorized) body { visibility: hidden; }
  </style>
</head>

<body class="bg-gurmaoblack text-gray-100 min-h-screen">
  <!-- Admin Guard -->
  <script type="module" src="admin-guard.js"></script>
  
  <!-- Toast Container -->
  <div id="toast-container"></div>
  
  <!-- Header -->
  <header class="bg-gradient-to-r from-gurmaoblack via-gray-900 to-gurmaoblack border-b border-gurmaogold/30 sticky top-0 z-50 backdrop-blur-lg bg-opacity-90">
    <div class="max-w-7xl mx-auto px-4 py-5 sm:px-6">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-6">
          <a href="admin.html" class="flex items-center gap-2 text-gurmaogold hover:text-yellow-300 transition-all duration-300 group">
            <span class="transform group-hover:-translate-x-1 transition-transform">←</span>
            <span class="font-medium">Admin panel</span>
          </a>
          <div class="h-6 w-px bg-gurmaogold/30"></div>
          <h1 class="text-2xl font-bold bg-gradient-to-r from-gurmaogold to-yellow-200 bg-clip-text text-transparent">
            📬 Správa zpráv
          </h1>
        </div>
        <div class="flex items-center gap-3">
          <!-- Notification Bell -->
          <div class="relative">
            <button id="notificationBtn" class="notification-bell p-3 bg-gradient-to-r from-gurmaogold/20 to-gurmaogold/10 hover:from-gurmaogold/30 hover:to-gurmaogold/20 rounded-xl transition-all duration-300 border border-gurmaogold/20 hover:border-gurmaogold/40 relative">
              <span class="text-2xl">🔔</span>
              <span id="notificationBadge" class="notification-badge hidden">0</span>
            </button>
            
            <!-- Notification Panel -->
            <div id="notificationPanel" class="notification-panel">
              <div class="p-4 border-b border-gurmaogold/20 sticky top-0 bg-gradient-to-r from-gurmaogold/10 to-transparent backdrop-blur-sm">
                <div class="flex items-center justify-between">
                  <h3 class="font-bold text-gurmaogold">📬 Nové zprávy</h3>
                  <button id="closeNotifications" class="text-gray-400 hover:text-white transition text-xl">×</button>
                </div>
              </div>
              <div id="notificationList">
                <!-- Notifications will be inserted here -->
              </div>
              <div id="noNotifications" class="hidden p-6 text-center text-gray-500">
                <div class="text-4xl mb-2">✅</div>
                <div>Žádné nové zprávy</div>
              </div>
            </div>
          </div>
          
          <button id="refreshBtn" class="px-5 py-2.5 bg-gradient-to-r from-gurmaogold/20 to-gurmaogold/10 hover:from-gurmaogold/30 hover:to-gurmaogold/20 rounded-xl transition-all duration-300 font-medium border border-gurmaogold/20 hover:border-gurmaogold/40 hover:shadow-lg hover:shadow-gurmaogold/20">
            🔄 Obnovit
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 py-8 sm:px-6">
    
    <!-- Stats & Filters -->
    <div class="mb-8 space-y-6">
      <!-- Stats -->
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div class="stat-card border border-gurmaogold/20 rounded-2xl p-6 relative overflow-hidden">
          <div class="absolute top-0 right-0 w-20 h-20 bg-gurmaogold/5 rounded-full -mr-10 -mt-10"></div>
          <div class="text-xs font-semibold text-gray-400 mb-2 uppercase tracking-wider">Celkem zpráv</div>
          <div class="text-4xl font-bold bg-gradient-to-br from-gurmaogold to-yellow-200 bg-clip-text text-transparent" id="stat-total">0</div>
        </div>
        <div class="stat-card border border-yellow-500/20 rounded-2xl p-6 relative overflow-hidden">
          <div class="absolute top-0 right-0 w-20 h-20 bg-yellow-500/5 rounded-full -mr-10 -mt-10"></div>
          <div class="text-xs font-semibold text-gray-400 mb-2 uppercase tracking-wider">Nové</div>
          <div class="text-4xl font-bold text-yellow-400" id="stat-new">0</div>
        </div>
        <div class="stat-card border border-blue-500/20 rounded-2xl p-6 relative overflow-hidden">
          <div class="absolute top-0 right-0 w-20 h-20 bg-blue-500/5 rounded-full -mr-10 -mt-10"></div>
          <div class="text-xs font-semibold text-gray-400 mb-2 uppercase tracking-wider">Zpracovávané</div>
          <div class="text-4xl font-bold text-blue-400" id="stat-progress">0</div>
        </div>
        <div class="stat-card border border-green-500/20 rounded-2xl p-6 relative overflow-hidden">
          <div class="absolute top-0 right-0 w-20 h-20 bg-green-500/5 rounded-full -mr-10 -mt-10"></div>
          <div class="text-xs font-semibold text-gray-400 mb-2 uppercase tracking-wider">Vyřízené</div>
          <div class="text-4xl font-bold text-green-400" id="stat-resolved">0</div>
        </div>
      </div>

      <!-- Filters -->
      <div class="flex flex-wrap gap-3">
        <button class="filter-btn active" data-filter="all">
          Všechny (<span id="count-all">0</span>)
        </button>
        <button class="filter-btn" data-filter="new">
          🆕 Nové (<span id="count-new">0</span>)
        </button>
        <button class="filter-btn" data-filter="in_progress">
          ⏳ Zpracovávané (<span id="count-progress">0</span>)
        </button>
        <button class="filter-btn" data-filter="resolved">
          ✅ Vyřízené (<span id="count-resolved">0</span>)
        </button>
        <button class="filter-btn" data-filter="spam">
          🚫 Spam (<span id="count-spam">0</span>)
        </button>
      </div>
    </div>

    <!-- Messages List -->
    <div id="messagesList" class="space-y-4">
      <!-- Loading -->
      <div id="loading" class="text-center py-12">
        <div class="text-gurmaogold text-xl">Načítám zprávy...</div>
      </div>
      
      <!-- Empty State -->
      <div id="emptyState" class="hidden text-center py-12">
        <div class="text-gray-400 text-xl">Žádné zprávy</div>
      </div>
    </div>

  </main>

  <!-- Message Detail Modal -->
  <div id="messageModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in">
    <div class="bg-gradient-to-br from-gray-900 via-gray-900 to-gray-800 border-2 border-gurmaogold/40 rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl shadow-gurmaogold/20">
      <div class="p-8">
        <!-- Header -->
        <div class="flex items-start justify-between mb-6 pb-6 border-b border-gurmaogold/20">
          <div class="flex-1">
            <div class="flex items-center gap-3 mb-3">
              <h2 class="text-3xl font-bold bg-gradient-to-r from-gurmaogold to-yellow-200 bg-clip-text text-transparent" id="modal-subject"></h2>
              <span id="modal-status-badge"></span>
            </div>
            <div class="text-sm text-gray-300 flex items-center gap-2 mb-2">
              <span class="font-semibold text-white" id="modal-name"></span>
              <span class="text-gurmaogold/40">•</span>
              <a id="modal-email" href="" class="text-gurmaogold hover:text-yellow-300 transition underline"></a>
            </div>
            <div class="text-xs font-medium text-gray-500 bg-gray-800/50 px-3 py-1 rounded-full inline-block" id="modal-date"></div>
          </div>
          <button id="closeModal" class="text-gray-400 hover:text-white text-3xl w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/10 transition-all duration-300">×</button>
        </div>

        <!-- Message -->
        <div class="bg-gradient-to-br from-gurmaoblack/80 to-gray-800/80 rounded-2xl p-6 mb-6 border border-gurmaogold/10">
          <div class="text-sm text-gray-400 mb-2 font-semibold uppercase tracking-wider">Zpráva:</div>
          <div class="text-gray-100 whitespace-pre-wrap leading-relaxed" id="modal-message"></div>
        </div>

        <!-- Actions -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
          <button class="status-action px-4 py-3 bg-gradient-to-br from-yellow-500/25 to-yellow-500/15 hover:from-yellow-500/35 hover:to-yellow-500/25 text-yellow-400 rounded-xl transition-all duration-300 font-semibold border border-yellow-500/30 hover:border-yellow-500/50 hover:shadow-lg hover:shadow-yellow-500/20" data-status="new">
            🆕 Nová
          </button>
          <button class="status-action px-4 py-3 bg-gradient-to-br from-blue-500/25 to-blue-500/15 hover:from-blue-500/35 hover:to-blue-500/25 text-blue-400 rounded-xl transition-all duration-300 font-semibold border border-blue-500/30 hover:border-blue-500/50 hover:shadow-lg hover:shadow-blue-500/20" data-status="in_progress">
            ⏳ Zpracovávám
          </button>
          <button class="status-action px-4 py-3 bg-gradient-to-br from-green-500/25 to-green-500/15 hover:from-green-500/35 hover:to-green-500/25 text-green-400 rounded-xl transition-all duration-300 font-semibold border border-green-500/30 hover:border-green-500/50 hover:shadow-lg hover:shadow-green-500/20" data-status="resolved">
            ✅ Vyřízeno
          </button>
          <button class="status-action px-4 py-3 bg-gradient-to-br from-red-500/25 to-red-500/15 hover:from-red-500/35 hover:to-red-500/25 text-red-400 rounded-xl transition-all duration-300 font-semibold border border-red-500/30 hover:border-red-500/50 hover:shadow-lg hover:shadow-red-500/20" data-status="spam">
            🚫 Spam
          </button>
        </div>

        <!-- Reply Button -->
        <div class="mt-4 pt-4 border-t border-gurmaogold/20">
          <button id="replyBtn" class="w-full px-6 py-3 bg-gradient-to-r from-gurmaogold to-yellow-600 hover:from-yellow-600 hover:to-gurmaogold text-gurmaoblack rounded-xl transition-all duration-300 font-bold text-lg shadow-lg hover:shadow-xl hover:shadow-gurmaogold/30">
            ✉️ Odpovědět emailem
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="toast.js"></script>
  <script type="module">
    import { getContactMessages, updateContactMessageStatus } from './supabase-client.js';

    let allMessages = [];
    let currentFilter = 'all';
    let currentMessageId = null;

    // Update notification badge
    function updateNotificationBadge() {
      const newCount = allMessages.filter(m => m.status === 'new').length;
      const badge = document.getElementById('notificationBadge');
      
      if (newCount > 0) {
        badge.textContent = newCount > 99 ? '99+' : newCount;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    // Render notification list
    function renderNotifications() {
      const newMessages = allMessages.filter(m => m.status === 'new').slice(0, 10);
      const list = document.getElementById('notificationList');
      const noNotif = document.getElementById('noNotifications');
      
      if (newMessages.length === 0) {
        list.innerHTML = '';
        noNotif.classList.remove('hidden');
        return;
      }
      
      noNotif.classList.add('hidden');
      list.innerHTML = newMessages.map(msg => `
        <div class="notification-item" data-id="${msg.id}">
          <div class="flex items-start gap-3">
            <div class="text-2xl">📩</div>
            <div class="flex-1 min-w-0">
              <div class="font-semibold text-white text-sm mb-1 truncate">${escapeHtml(msg.subject)}</div>
              <div class="text-xs text-gray-400 mb-1">${escapeHtml(msg.name)} • ${escapeHtml(msg.email)}</div>
              <div class="text-xs text-gray-500">${formatDate(msg.created_at)}</div>
            </div>
          </div>
        </div>
      `).join('');
      
      // Add click handlers
      list.querySelectorAll('.notification-item').forEach(item => {
        item.addEventListener('click', () => {
          const id = item.dataset.id;
          document.getElementById('notificationPanel').classList.remove('active');
          showMessageDetail(id);
        });
      });
    }

    // Toggle notification panel
    document.getElementById('notificationBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      const panel = document.getElementById('notificationPanel');
      panel.classList.toggle('active');
      renderNotifications();
    });

    // Close notification panel
    document.getElementById('closeNotifications').addEventListener('click', (e) => {
      e.stopPropagation();
      document.getElementById('notificationPanel').classList.remove('active');
    });

    // Close panel when clicking outside
    document.addEventListener('click', (e) => {
      const panel = document.getElementById('notificationPanel');
      const btn = document.getElementById('notificationBtn');
      if (!panel.contains(e.target) && !btn.contains(e.target)) {
        panel.classList.remove('active');
      }
    });

    // Load messages
    async function loadMessages() {
      try {
        document.getElementById('loading').classList.remove('hidden');
        document.getElementById('emptyState').classList.add('hidden');
        
        allMessages = await getContactMessages();
        
        // Sort by date (newest first)
        allMessages.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
        
        updateStats();
        renderMessages();
        updateNotificationBadge();
        renderNotifications();
        
      } catch (error) {
        console.error('Error loading messages:', error);
        window.toast?.show('❌ Chyba při načítání zpráv', 'error');
      } finally {
        document.getElementById('loading').classList.add('hidden');
      }
    }

    // Update stats
    function updateStats() {
      const stats = {
        total: allMessages.length,
        new: allMessages.filter(m => m.status === 'new').length,
        in_progress: allMessages.filter(m => m.status === 'in_progress').length,
        resolved: allMessages.filter(m => m.status === 'resolved').length,
        spam: allMessages.filter(m => m.status === 'spam').length
      };

      document.getElementById('stat-total').textContent = stats.total;
      document.getElementById('stat-new').textContent = stats.new;
      document.getElementById('stat-progress').textContent = stats.in_progress;
      document.getElementById('stat-resolved').textContent = stats.resolved;

      document.getElementById('count-all').textContent = stats.total;
      document.getElementById('count-new').textContent = stats.new;
      document.getElementById('count-progress').textContent = stats.in_progress;
      document.getElementById('count-resolved').textContent = stats.resolved;
      document.getElementById('count-spam').textContent = stats.spam;
    }

    // Render messages
    function renderMessages() {
      const container = document.getElementById('messagesList');
      const filtered = currentFilter === 'all' 
        ? allMessages 
        : allMessages.filter(m => m.status === currentFilter);

      if (filtered.length === 0) {
        container.innerHTML = '<div class="text-center py-12 text-gray-400">Žádné zprávy v této kategorii</div>';
        return;
      }

      container.innerHTML = filtered.map(msg => `
        <div class="message-card bg-gradient-to-br from-gray-900 to-gray-900/80 border border-gurmaogold/20 rounded-2xl p-6 cursor-pointer backdrop-blur-sm" data-id="${msg.id}">
          <div class="flex items-start justify-between gap-4">
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-3 mb-3">
                <h3 class="text-lg font-bold text-transparent bg-gradient-to-r from-gurmaogold to-yellow-200 bg-clip-text truncate">${escapeHtml(msg.subject)}</h3>
                ${getStatusBadge(msg.status)}
              </div>
              <div class="text-sm text-gray-300 mb-3 flex items-center gap-2">
                <span class="font-semibold text-white">${escapeHtml(msg.name)}</span>
                <span class="text-gurmaogold/40">•</span>
                <span class="text-gray-400">${escapeHtml(msg.email)}</span>
              </div>
              <div class="text-gray-400 text-sm message-text leading-relaxed">${escapeHtml(msg.message)}</div>
            </div>
            <div class="flex flex-col items-end gap-2">
              <div class="text-xs font-medium text-gray-500 whitespace-nowrap bg-gray-800/50 px-3 py-1 rounded-full">
                ${formatDate(msg.created_at)}
              </div>
            </div>
          </div>
        </div>
      `).join('');

      // Add click handlers
      container.querySelectorAll('.message-card').forEach(card => {
        card.addEventListener('click', () => {
          const id = card.dataset.id;
          showMessageDetail(id);
        });
      });
    }

    // Show message detail
    function showMessageDetail(messageId) {
      const msg = allMessages.find(m => m.id === messageId);
      if (!msg) return;

      currentMessageId = messageId;

      document.getElementById('modal-subject').textContent = msg.subject;
      document.getElementById('modal-name').textContent = msg.name;
      document.getElementById('modal-email').textContent = msg.email;
      document.getElementById('modal-email').href = `mailto:${msg.email}`;
      document.getElementById('modal-message').textContent = msg.message;
      document.getElementById('modal-date').textContent = formatDateLong(msg.created_at);
      document.getElementById('modal-status-badge').innerHTML = getStatusBadge(msg.status);

      // Highlight current status button
      document.querySelectorAll('.status-action').forEach(btn => {
        if (btn.dataset.status === msg.status) {
          btn.style.opacity = '1';
          btn.style.fontWeight = '700';
        } else {
          btn.style.opacity = '0.7';
          btn.style.fontWeight = '500';
        }
      });

      document.getElementById('messageModal').classList.remove('hidden');
    }

    // Close modal
    function closeModal() {
      document.getElementById('messageModal').classList.add('hidden');
      currentMessageId = null;
    }

    // Reply to message via email
    function replyToMessage() {
      const msg = allMessages.find(m => m.id === currentMessageId);
      if (!msg) return;

      const subject = encodeURIComponent(`Re: ${msg.subject}`);
      const body = encodeURIComponent(`\n\n---\nPůvodní zpráva od ${msg.name}:\n${msg.message}`);
      
      window.location.href = `mailto:${msg.email}?subject=${subject}&body=${body}`;
      
      // Optionally mark as in_progress when replying
      if (msg.status === 'new') {
        updateStatus('in_progress');
      }
    }

    // Update message status
    async function updateStatus(status) {
      if (!currentMessageId) return;

      try {
        await updateContactMessageStatus(currentMessageId, status);
        
        // Update local data
        const msg = allMessages.find(m => m.id === currentMessageId);
        if (msg) {
          msg.status = status;
        }

        updateStats();
        renderMessages();
        updateNotificationBadge();
        renderNotifications();
        closeModal();
        
        window.toast?.show('✅ Status aktualizován', 'success');
      } catch (error) {
        console.error('Error updating status:', error);
        window.toast?.show('❌ Chyba při aktualizaci statusu', 'error');
      }
    }

    // Helper functions
    function getStatusBadge(status) {
      const badges = {
        new: '<span class="status-badge status-new">🆕 Nová</span>',
        in_progress: '<span class="status-badge status-in_progress">⏳ Zpracovává se</span>',
        resolved: '<span class="status-badge status-resolved">✅ Vyřízeno</span>',
        spam: '<span class="status-badge status-spam">🚫 Spam</span>'
      };
      return badges[status] || badges.new;
    }

    function formatDate(dateString) {
      const date = new Date(dateString);
      const now = new Date();
      const diff = now - date;
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      
      if (days === 0) return 'Dnes';
      if (days === 1) return 'Včera';
      if (days < 7) return `Před ${days} dny`;
      
      return date.toLocaleDateString('cs-CZ', { day: 'numeric', month: 'short' });
    }

    function formatDateLong(dateString) {
      const date = new Date(dateString);
      return date.toLocaleDateString('cs-CZ', { 
        day: 'numeric', 
        month: 'long', 
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Event listeners
    document.getElementById('refreshBtn').addEventListener('click', loadMessages);
    document.getElementById('closeModal').addEventListener('click', closeModal);
    
    // Click outside modal to close
    document.getElementById('messageModal').addEventListener('click', (e) => {
      if (e.target.id === 'messageModal') closeModal();
    });

    // Filter buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentFilter = btn.dataset.filter;
        
        // Update active state
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        renderMessages();
      });
    });

    // Status action buttons
    document.querySelectorAll('.status-action').forEach(btn => {
      btn.addEventListener('click', () => {
        updateStatus(btn.dataset.status);
      });
    });

    // Reply button
    document.getElementById('replyBtn').addEventListener('click', replyToMessage);

    // Initial load
    loadMessages();
  </script>
</body>
</html>
