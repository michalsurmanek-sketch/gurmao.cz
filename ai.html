<script>
// Custom dropdown functionality
let formValues = {
  mood: '',
  occasion: '',
  groupSize: '',
  city: '',
  priceLevel: ''
};

function initCustomDropdown(btnId, optionsId, key) {
  const btn = document.getElementById(btnId);
  const options = document.getElementById(optionsId);
  
  if (!btn || !options) return;
  
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    // Close other dropdowns
    document.querySelectorAll('.custom-options').forEach(o => {
      if (o !== options) o.classList.add('hidden');
    });
    options.classList.toggle('hidden');
    
    // Scroll dropdown into view when opened
    if (!options.classList.contains('hidden')) {
      setTimeout(() => {
        options.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }, 100);
    }
  });
  
  options.querySelectorAll('.custom-option').forEach(opt => {
    opt.addEventListener('click', () => {
      const value = opt.dataset.value;
      btn.textContent = opt.textContent;
      options.classList.add('hidden');
      formValues[key] = value;
    });
  });
}

// Close dropdowns when clicking outside
document.addEventListener('click', () => {
  document.querySelectorAll('.custom-options').forEach(o => o.classList.add('hidden'));
});

// Initialize all dropdowns
document.addEventListener('DOMContentLoaded', () => {
  initCustomDropdown('moodBtn', 'moodOptions', 'mood');
  initCustomDropdown('occasionBtn', 'occasionOptions', 'occasion');
  initCustomDropdown('groupSizeBtn', 'groupSizeOptions', 'groupSize');
  initCustomDropdown('cityBtn', 'cityOptions', 'city');
  initCustomDropdown('priceLevelBtn', 'priceLevelOptions', 'priceLevel');
  
  // Update form submit handler to use formValues
  const form = document.getElementById('aiRecommendationForm');
  const originalHandler = form?.onsubmit;
  
  if (form) {
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const resultsContainer = document.getElementById('aiResults');
      if (!resultsContainer) return;
      
      // Show loading
      resultsContainer.innerHTML = `
        <div class="text-center py-12">
          <div class="inline-block animate-spin text-4xl mb-4">🤖</div>
          <div class="text-white/60">AI přemýšlí...</div>
        </div>
      `;
      
      // Simulate AI processing delay
      setTimeout(async () => {
        const query = {
          mood: formValues.mood || null,
          occasion: formValues.occasion || null,
          groupSize: parseInt(formValues.groupSize) || null,
          city: formValues.city || null,
          priceLevel: parseInt(formValues.priceLevel) || null,
          freeText: form.querySelector('[name="freeText"]')?.value || ''
        };
        
        const html = await window.aiEngine.renderRecommendations(query);
        resultsContainer.innerHTML = html;
        
        // Scroll to results
        resultsContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 1200);
    });
  }
  
  // Reset button
  const resetBtn = document.getElementById('resetForm');
  if (resetBtn) {
    resetBtn.addEventListener('click', () => {
      formValues = { mood: '', occasion: '', groupSize: '', city: '', priceLevel: '' };
      document.getElementById('moodBtn').textContent = '-- Vyber náladu --';
      document.getElementById('occasionBtn').textContent = '-- Vyber příležitost --';
      document.getElementById('groupSizeBtn').textContent = '-- Kolik vás bude? --';
      document.getElementById('cityBtn').textContent = '-- Kde hledáš? --';
      document.getElementById('priceLevelBtn').textContent = '-- Rozpočet --';
      form.querySelector('[name="freeText"]').value = '';
      document.getElementById('aiResults').innerHTML = '';
    });
  }
});
</script>
