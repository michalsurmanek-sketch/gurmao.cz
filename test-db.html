<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test databáze - GURMAO</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white p-8">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold mb-6">Test databázového připojení</h1>
    
    <div class="mb-6">
      <button id="testBtn" class="px-6 py-3 bg-yellow-600 hover:bg-yellow-700 rounded-lg font-semibold">
        Test načtení restaurací
      </button>
    </div>
    
    <div id="status" class="mb-4 p-4 rounded-lg bg-gray-800"></div>
    
    <div id="results" class="space-y-4"></div>
  </div>

  <script type="module">
    import { supabase } from './supabase-client.js';
    
    const testBtn = document.getElementById('testBtn');
    const status = document.getElementById('status');
    const results = document.getElementById('results');
    
    testBtn.addEventListener('click', async () => {
      status.textContent = 'Načítám data...';
      status.className = 'mb-4 p-4 rounded-lg bg-blue-800';
      results.innerHTML = '';
      
      try {
        const { data: restaurants, error } = await supabase
          .from('restaurants')
          .select('*')
          .limit(10);
        
        if (error) throw error;
        
        status.textContent = `✅ Úspěšně načteno ${restaurants.length} restaurací`;
        status.className = 'mb-4 p-4 rounded-lg bg-green-800';
        
        // Zobrazit data
        results.innerHTML = `
          <h2 class="text-xl font-bold mb-4">Prvních 10 restaurací:</h2>
          <div class="grid gap-3">
            ${restaurants.map(r => `
              <div class="p-4 bg-gray-800 rounded-lg">
                <div class="flex justify-between items-start">
                  <div>
                    <div class="text-yellow-500 text-sm">${r.vibe}</div>
                    <div class="font-bold text-lg">${r.name}</div>
                    <div class="text-gray-400 text-sm">${r.city} · ${r.tag}</div>
                  </div>
                  <div class="text-xs text-gray-500">
                    ${r.latitude && r.longitude ? '📍 GPS OK' : '❌ Bez GPS'}
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        `;
        
        // Statistiky
        const { count } = await supabase
          .from('restaurants')
          .select('*', { count: 'exact', head: true });
        
        results.innerHTML += `
          <div class="mt-6 p-4 bg-gray-800 rounded-lg">
            <h3 class="font-bold mb-2">Celková statistika:</h3>
            <ul class="space-y-1 text-sm">
              <li>📊 Celkem restaurací v databázi: <strong>${count}</strong></li>
              <li>📍 S GPS souřadnicemi: ${restaurants.filter(r => r.latitude && r.longitude).length} z ${restaurants.length}</li>
              <li>🖼️ S obrázky: ${restaurants.filter(r => r.image_url).length} z ${restaurants.length}</li>
            </ul>
          </div>
        `;
        
      } catch (error) {
        status.textContent = `❌ Chyba: ${error.message}`;
        status.className = 'mb-4 p-4 rounded-lg bg-red-800';
        console.error('Error:', error);
      }
    });
    
    // Automaticky spustit test při načtení
    testBtn.click();
  </script>
</body>
</html>
