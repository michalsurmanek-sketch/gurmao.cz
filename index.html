    body { font-family: 'Inter', sans-serif; }

    /* Logo fade transition */
    header a.modal-title {
      transition: opacity 0.3s ease;

    /* ====== VYBER SI PODLE NÁLADY (CSS) ====== */
    .vibe-section{
      padding: 26px 20px 68px;
      position:relative;
    }

    .vibe-title{
      margin: 26px auto 20px;
      text-align:center;
      font-family: "Playfair Display", serif;
      font-size: 30px;
      color: #D4AF37;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:18px;
    }

    .vibe-title::before,
    .vibe-title::after{
      content:"";
      height:1px;
      width:min(210px, 26vw);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.14), transparent);
    }

    .vibe-grid{
      max-width: 1120px;
      margin: 0 auto;
      display:grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 18px;
      align-items:start;
      padding-top: 10px;
    }

    .vibe-item{ text-align:center; }

    .vibe-pill{
      --ring: rgba(255,255,255,.10);
      --glow: rgba(255,255,255,.08);
      --fillA: rgba(255,255,255,.05);
      --fillB: rgba(0,0,0,.18);

      width: 100%;
      height: 54px;
      border-radius: 999px;
      border: 1px solid var(--ring);
      background:
        radial-gradient(120px 60px at 20% 20%, rgba(255,255,255,.06), transparent 60%),
        linear-gradient(180deg, var(--fillA), var(--fillB));
      backdrop-filter: blur(10px);

      display:flex;
      align-items:center;
      justify-content:center;
      gap: 12px;

      box-shadow: 0 0 36px var(--glow);
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
      user-select:none;
      cursor: pointer;
    }

    .vibe-pill:hover{
      transform: translateY(-2px);
      box-shadow: 0 0 46px var(--glow);
      border-color: color-mix(in srgb, var(--ring) 70%, rgba(255,255,255,.18));
    }

    .vibe-ico{
      width: 28px;
      height: 28px;
      border-radius: 999px;
      display:grid;
      place-items:center;

      border: 1px solid color-mix(in srgb, var(--ring) 70%, rgba(255,255,255,.14));
      background: rgba(0,0,0,.18);
      box-shadow: 0 0 22px var(--glow);

      font-size: 15px;
      line-height: 1;
    }

    .vibe-name{
      font-weight: 900;
      letter-spacing: .10em;
      font-size: 13px;
      text-transform: uppercase;
      color: rgba(255,255,255,.82);
    }

    .vibe-desc{
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.45;
      color: rgba(255,255,255,.46);
    }

    /* per-vibe tuning */
    .vibe-pill.luxe { --ring: rgba(201,162,77,.32); --glow: rgba(201,162,77,.16); --fillA: rgba(201,162,77,.18); --fillB: rgba(0,0,0,.22); }
    .vibe-pill.drama{ --ring: rgba(200,90,90,.30); --glow: rgba(200,90,90,.16); --fillA: rgba(200,90,90,.14); --fillB: rgba(0,0,0,.22); }
    .vibe-pill.chaos{ --ring: rgba(210,160,70,.30); --glow: rgba(210,160,70,.16); --fillA: rgba(210,160,70,.14); --fillB: rgba(0,0,0,.22); }
    .vibe-pill.pure { --ring: rgba(140,190,150,.30); --glow: rgba(140,190,150,.16); --fillA: rgba(140,190,150,.14); --fillB: rgba(0,0,0,.22); }
    .vibe-pill.dark { --ring: rgba(255,255,255,.18); --glow: rgba(255,255,255,.10); --fillA: rgba(255,255,255,.06); --fillB: rgba(0,0,0,.28); }
    .vibe-pill.calm { --ring: rgba(100,150,200,.30); --glow: rgba(100,150,200,.16); --fillA: rgba(100,150,200,.14); --fillB: rgba(0,0,0,.22); }

    /* active state like screenshot */
    .vibe-pill.is-active{
      box-shadow: 0 0 56px var(--glow);
      border-color: color-mix(in srgb, var(--ring) 70%, rgba(255,255,255,.18));
    }

    /* responsive */
@media (max-width: 980px){
  .vibe-grid{ grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

@media (max-width: 520px){
  .vibe-grid{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

      heroLoginBtn.href = 'collections.html';
      heroLoginBtn.textContent = 'Můj výběr';
    }
  }

  // Load featured chef profile
  import { supabase } from './supabase-client.js';
  
  async function loadFeaturedChef() {
    try {
      // Load first chef (you can change this to load a specific chef by slug)
      const { data: chef, error } = await supabase
        .from('chefs')
        .select(`
          *,
          restaurants (
            name,
            city
          )
        `)
        .limit(1)
        .single();
      
      if (error) throw error;
      
      console.log('Loaded chef data:', chef); // Debug log
      
      if (chef) {
        // Update chef profile section
        if (chef.image_url) {
          const chefImage = document.getElementById('chefImage');
          chefImage.style.backgroundImage = `url('${chef.image_url}')`;
        }
        
        if (chef.name) {
          document.getElementById('chefName').textContent = chef.name;
        }
        
        if (chef.bio) {
          document.getElementById('chefBio').textContent = chef.bio;
        }
        
        // Update label with vibe
        if (chef.vibe) {
          document.getElementById('chefLabel').textContent = `🧑‍🍳 Head Chef · ${chef.vibe}`;
        }
        
        // Update restaurant
        if (chef.restaurants) {
          const restaurantText = chef.restaurants.city 
            ? `${chef.restaurants.name} · ${chef.restaurants.city}`
            : chef.restaurants.name;
          document.getElementById('chefRestaurant').textContent = restaurantText;
        }
        
        // Update favorite cuisines
        console.log('Chef favorite_cuisines:', chef.favorite_cuisines); // Debug
        if (chef.favorite_cuisines && chef.favorite_cuisines.trim() !== '') {
          document.getElementById('chefCuisines').textContent = chef.favorite_cuisines;
        } else {
          console.log('No favorite cuisines - keeping placeholder'); // Debug
          document.getElementById('chefCuisines').textContent = '—';
        }
      }
    } catch (err) {
      console.error('Error loading featured chef:', err);
      // Keep default content if loading fails
    }
  }
  
  // Load on page load
  loadFeaturedChef();
</script>
