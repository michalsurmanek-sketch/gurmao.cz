<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <title>Můj profil – GURMAO</title>
  <meta name="description" content="Správa profilu, hesla a účtu GURMAO.">
  <meta name="robots" content="noindex,follow">
  <link rel="stylesheet" href="tailwind.min.css">
  <link rel="stylesheet" href="global.css?v=20260823-profile-1">
  <link rel="stylesheet" href="toast.css">
  <style>
    body{font-family:Inter,system-ui,sans-serif}
    h1,h2{font-family:"Playfair Display",Georgia,serif}
    .verification-badge{display:inline-flex;align-items:center;padding:.35rem .7rem;border:1px solid rgba(255,255,255,.16);border-radius:999px;color:rgba(255,255,255,.6);font:600 .72rem/1 Inter,system-ui,sans-serif}
    .verification-badge.verified{border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.08);color:#86efac}
    .verification-badge.unverified{border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.08);color:#fde68a}
  </style>
</head>
<body class="min-h-screen bg-gurmaoblack text-white">
  <script src="auth-guard.js?v=20260823-profile-1"></script>
  <script src="toast.js"></script>

  <header class="border-b border-white/10 bg-gurmaoblack/90 backdrop-blur">
    <div class="mx-auto flex h-16 max-w-5xl items-center justify-between px-5">
      <a href="index.html" class="modal-title text-2xl" aria-label="GURMAO – domů">GUR<span class="text-gurmaogold">M</span>AO</a>
      <a href="collections.html" class="rounded-full border border-white/15 px-4 py-2 text-sm text-white/70 transition hover:border-gurmaogold hover:text-gurmaogold">Můj výběr</a>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-5 py-8 md:py-12">
    <section class="mb-8 border-b border-white/10 pb-7">
      <div class="flex flex-wrap items-center gap-3">
        <h1 class="text-4xl font-semibold">Můj profil</h1>
        <span id="verificationBadge" class="verification-badge">Ověřuji e-mail…</span>
      </div>
      <p id="userEmail" class="mt-3 text-sm text-white/55">Načítám účet…</p>
      <p id="profileStatus" class="mt-2 min-h-5 text-sm text-white/55" role="status" aria-live="polite"></p>
    </section>

    <div class="grid gap-6 lg:grid-cols-2">
      <section class="rounded-3xl border border-white/10 bg-white/5 p-6 md:p-7" aria-labelledby="personalTitle">
        <h2 id="personalTitle" class="mb-5 text-2xl">Osobní údaje</h2>
        <form id="profileForm" class="space-y-5">
          <div>
            <label for="displayName" class="mb-2 block text-sm text-white/65">Jméno</label>
            <input id="displayName" type="text" maxlength="80" autocomplete="name" class="w-full rounded-xl border border-white/10 bg-black/25 px-4 py-3 outline-none transition focus:border-gurmaogold" placeholder="Tvoje jméno">
          </div>
          <div>
            <label for="bio" class="mb-2 block text-sm text-white/65">Bio</label>
            <textarea id="bio" rows="8" maxlength="1000" class="w-full resize-y rounded-xl border border-white/10 bg-black/25 px-4 py-3 outline-none transition focus:border-gurmaogold" placeholder="Něco o tobě…"></textarea>
            <p class="mt-2 text-xs text-white/40">Maximálně 1 000 znaků.</p>
          </div>
          <button id="saveProfileBtn" type="submit" class="w-full rounded-xl bg-gurmaogold px-5 py-3 font-semibold text-black transition hover:brightness-110 disabled:cursor-wait disabled:opacity-60">Uložit změny</button>
        </form>
      </section>

      <div class="space-y-6">
        <section class="rounded-3xl border border-white/10 bg-white/5 p-6 md:p-7" aria-labelledby="passwordTitle">
          <h2 id="passwordTitle" class="mb-5 text-2xl">Změna hesla</h2>
          <form id="passwordForm" class="space-y-5">
            <div>
              <label for="newPassword" class="mb-2 block text-sm text-white/65">Nové heslo</label>
              <input id="newPassword" type="password" minlength="10" autocomplete="new-password" required class="w-full rounded-xl border border-white/10 bg-black/25 px-4 py-3 outline-none transition focus:border-gurmaogold" placeholder="Alespoň 10 znaků">
            </div>
            <div>
              <label for="confirmPassword" class="mb-2 block text-sm text-white/65">Potvrzení hesla</label>
              <input id="confirmPassword" type="password" minlength="10" autocomplete="new-password" required class="w-full rounded-xl border border-white/10 bg-black/25 px-4 py-3 outline-none transition focus:border-gurmaogold" placeholder="Zopakuj nové heslo">
            </div>
            <button id="changePasswordBtn" type="submit" class="w-full rounded-xl border border-gurmaogold/45 px-5 py-3 font-semibold text-gurmaogold transition hover:bg-gurmaogold hover:text-black disabled:cursor-wait disabled:opacity-60">Změnit heslo</button>
          </form>
        </section>

        <section class="rounded-3xl border border-red-400/25 bg-red-500/5 p-6 md:p-7" aria-labelledby="dangerTitle">
          <h2 id="dangerTitle" class="text-2xl text-red-300">Smazání účtu</h2>
          <p class="mt-3 text-sm leading-6 text-white/55">Účet a uživatelská data budou odstraněna natrvalo. Tuto operaci nelze vrátit.</p>
          <button id="deleteAccountBtn" type="button" class="mt-5 w-full rounded-xl border border-red-400/50 px-5 py-3 font-semibold text-red-300 transition hover:bg-red-500/15 disabled:cursor-wait disabled:opacity-60">Smazat účet</button>
        </section>
      </div>
    </div>
  </main>

  <footer class="border-t border-white/10 py-7 text-center text-xs text-white/40">© 2026 GURMAO.cz · Nejez. Prožij.</footer>

  <script type="module" src="profile-page.js?v=20260823-1"></script>
  <script src="cookie-consent.js?v=20260823-1"></script>
</body>
</html>
