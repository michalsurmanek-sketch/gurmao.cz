<!-- Supabase Client -->
<script type="module">
  import { supabase, getCurrentUser, updateUserProfile, updatePassword } from './supabase-client.js';

  let currentUser = null;

  // Load user data
  async function loadUserData() {
    try {
      currentUser = await getCurrentUser();
      
      if (!currentUser) {
        window.location.href = 'login.html';
        return;
      }

      // Display user info
      document.getElementById('userEmail').textContent = currentUser.email;
      document.getElementById('displayName').value = currentUser.user_metadata?.display_name || '';
      document.getElementById('bio').value = currentUser.user_metadata?.bio || '';
      
    } catch (error) {
      console.error('Error loading user:', error);
      window.toast.show('❌ Chyba při načítání profilu', 'error');
    }
  }

  // Update profile
  document.getElementById('profileForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const displayName = document.getElementById('displayName').value;
    const bio = document.getElementById('bio').value;
    
    const submitBtn = document.getElementById('saveProfileBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Ukládám...';
    
    try {
      const { data, error } = await supabase.auth.updateUser({
        data: {
          display_name: displayName,
          bio: bio
        }
      });
      
      if (error) throw error;
      
      window.toast.show('✅ Profil byl aktualizován', 'success');
      
    } catch (error) {
      console.error('Profile update error:', error);
      window.toast.show('❌ Chyba při ukládání profilu', 'error');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Uložit změny';
    }
  });

  // Update password
  document.getElementById('passwordForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    
    if (newPassword !== confirmPassword) {
      window.toast.show('❌ Hesla se neshodují', 'error');
      return;
    }
    
    if (newPassword.length < 8) {
      window.toast.show('❌ Heslo musí mít alespoň 8 znaků', 'error');
      return;
    }
    
    const submitBtn = document.getElementById('changePasswordBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Měním heslo...';
    
    try {
      await updatePassword(newPassword);
      
      window.toast.show('✅ Heslo bylo změněno', 'success');
      
      // Reset form
      document.getElementById('passwordForm').reset();
      
    } catch (error) {
      console.error('Password change error:', error);
      window.toast.show('❌ Chyba při změně hesla', 'error');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Změnit heslo';
    }
  });

  // Delete account
  document.getElementById('deleteAccountBtn').addEventListener('click', async () => {
    if (!confirm('Opravdu chceš smazat svůj účet? Tuto akci nelze vrátit zpět.')) {
      return;
    }
    
    if (!confirm('Poslední varování: Všechna tvoje data budou natrvalo smazána. Pokračovat?')) {
      return;
    }
    
    window.toast.show('⚠️ Funkce zatím není implementována', 'info');
    // TODO: Implement account deletion
  });

  // Load data on page load
  loadUserData();
</script>

  <!-- Grid Layout -->

        <form id="profileForm" class="space-y-4">
          <div>
            <label for="displayName" class="block text-xs text-white/60 mb-1.5">Jméno</label>
            <input

              id="displayName"
              class="w-full px-3 py-2 rounded-lg bg-white/5 border border-white/10 focus:border-gurmaogold focus:outline-none transition text-sm"
              placeholder="Tvoje jméno"
            />
          </div>

          <div>
            <label for="bio" class="block text-xs text-white/60 mb-1.5">Bio</label>
            <textarea
              id="bio"
              rows="8"
              class="w-full px-3 py-2 rounded-lg bg-white/5 border border-white/10 focus:border-gurmaogold focus:outline-none transition text-sm resize-none"
              placeholder="O mně..."
            ></textarea>
          </div>

          <button
            type="submit"
            id="saveProfileBtn"
            class="w-full px-4 py-2 rounded-lg bg-gurmaogold text-black font-medium text-sm hover:bg-gurmaogold/90 transition"
          >
            Uložit
          </button>
        </form>
      </div>
    </div>

    <!-- Right Column - Security & Danger -->
    <div class="space-y-6">
      <!-- Security -->
      <div class="bg-white/5 border border-white/10 rounded-xl p-6">
        <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
          <span class="text-blue-400">🔒</span> Heslo
        </h2>
        
        <form id="passwordForm" class="space-y-4">
          <div>
            <label for="newPassword" class="block text-xs text-white/60 mb-1.5">Nové heslo</label>
            <input
              type="password"
              id="newPassword"
              minlength="8"
              required
              class="w-full px-3 py-2 rounded-lg bg-white/5 border border-white/10 focus:border-blue-400 focus:outline-none transition text-sm"
              placeholder="Min. 8 znaků"
            />
          </div>

          <div>
            <label for="confirmPassword" class="block text-xs text-white/60 mb-1.5">Potvrď heslo</label>
            <input
              type="password"
              id="confirmPassword"
              minlength="8"
              required
              class="w-full px-3 py-2 rounded-lg bg-white/5 border border-white/10 focus:border-blue-400 focus:outline-none transition text-sm"
              placeholder="Znovu"
            />
          </div>

          <button
            type="submit"
            id="changePasswordBtn"
            class="w-full px-4 py-2 rounded-lg bg-white/10 border border-white/20 text-white font-medium text-sm hover:bg-white/15 transition"
          >
            Změnit
          </button>
        </form>
      </div>

      <!-- Danger Zone -->
      <div class="bg-gurmaored/5 border border-gurmaored/30 rounded-xl p-6">
        <h2 class="text-lg font-semibold mb-2 flex items-center gap-2 text-gurmaored">
          ⚠️ Nebezpečná zóna
        </h2>
        <p class="text-xs text-white/50 mb-4">Smazání účtu je nevratné.</p>
        
        <button
          id="deleteAccountBtn"
          class="w-full px-4 py-2 rounded-lg bg-gurmaored/10 border border-gurmaored text-gurmaored font-medium text-sm hover:bg-gurmaored hover:text-white transition"
        >
          Smazat účet
        </button>
      </div>
    </div>

  </div>
