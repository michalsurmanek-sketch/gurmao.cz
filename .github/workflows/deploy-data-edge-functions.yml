name: Deploy restaurant data Edge Functions

on:
  workflow_dispatch:
  push:
    paths:
      - 'supabase/config.toml'
      - 'supabase/functions/google-place-photo/**'
      - 'supabase/functions/sync-opening-hours/**'
      - 'supabase/functions/submit-contact/**'
      - 'supabase/functions/delete-account/**'
      - '.github/workflows/deploy-data-edge-functions.yml'

permissions:
  contents: read

concurrency:
  group: deploy-data-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate deployment configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo 'Missing SUPABASE_ACCESS_TOKEN' && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo 'Missing SUPABASE_PROJECT_REF' && exit 1)
          supabase --version
          supabase functions deploy --help >/dev/null

      - name: Deploy Google photo proxy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy google-place-photo --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy opening hours sync
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy sync-opening-hours --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy protected contact form
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy submit-contact --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy account deletion
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy delete-account --project-ref "$SUPABASE_PROJECT_REF"
