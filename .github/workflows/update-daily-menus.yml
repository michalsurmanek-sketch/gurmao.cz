name: Aktualizace denních menu

on:
  schedule:
    - cron: '15 4 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-menus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Stažení repozitáře
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Aktualizovat denní menu
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MENU_UPDATE_LIMIT: '500'
        run: node scripts/update-daily-menus.mjs
