name: Aktualizace denních menu

on:
  schedule:
    - cron: '15 4 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update-daily-menus-v2.mjs'
      - 'scripts/clean-daily-menus.mjs'
      - '.github/workflows/update-daily-menus.yml'

permissions:
  contents: read

jobs:
  update-menus:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Stažení repozitáře
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Nainstalovat PDF a OCR nástroje
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-ces tesseract-ocr-eng

      - name: Aktualizovat denní menu
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MENU_UPDATE_LIMIT: '500'
        run: node scripts/update-daily-menus-v2.mjs

      - name: Vyčistit uložená menu
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/clean-daily-menus.mjs
