name: Aktualizace údajů restaurací

on:
  schedule:
    - cron: '35 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-restaurant-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Stažení repozitáře
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Aktualizovat otevírací dobu a kontaktní údaje
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESTAURANT_DATA_UPDATE_LIMIT: '500'
        run: node scripts/update-restaurant-data.mjs
