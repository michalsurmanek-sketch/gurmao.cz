name: Quality check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check auth-ui.js
          node --check mapa.js
          node --check restaurace.js
          node --check ai-recommendations.js
          node --check ai-form-runtime.js
          node --check ai-redesign.js
          node --check contact-form-runtime.js
          node --check cookie-consent.js
          node --check rating.js
          node --check restaurant-card-enhancements.js
          node --check restaurant-recommendation-card.js
          node --check restaurant-detail-page.js
          node --check service-worker.js
          node --check scripts/generate-sitemap.mjs

      - name: Run project tests
        run: npm test
