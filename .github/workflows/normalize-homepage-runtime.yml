name: Normalize homepage runtime

on:
  push:
    branches: [main]
    paths:
      - 'scripts/normalize-homepage-runtime.py'
      - '.github/workflows/normalize-homepage-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: normalize-homepage-runtime
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize homepage runtime
        run: python scripts/normalize-homepage-runtime.py

      - name: Commit homepage when changed
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'Homepage runtime is already normalized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Normalize homepage runtime loading'
          git push
