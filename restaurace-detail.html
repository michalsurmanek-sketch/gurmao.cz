<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Přesměrování restaurace | GURMAO</title>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var identifier = params.get('id') || params.get('slug');
      if (!identifier) {
        window.location.replace('restaurace.html');
        return;
      }
      var target = new URL('restaurant.html', window.location.href);
      target.searchParams.set('slug', identifier);
      target.hash = window.location.hash;
      window.location.replace(target.href);
    })();
  </script>
</head>
<body>
  <p>Přesměrovávám na aktuální detail restaurace…</p>
  <noscript><a href="restaurace.html">Zpět na restaurace</a></noscript>
</body>
</html>
