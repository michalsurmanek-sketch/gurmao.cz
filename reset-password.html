<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  
  <!-- Primary Meta Tags -->
  <title>Reset hesla – GURMAO</title>
  <meta name="title" content="Reset hesla – GURMAO">
  <meta name="description" content="Obnov si přístup k svému GURMAO účtu. Nastav nové heslo a pokračuj v objevování gastronomie." />
  <meta name="robots" content="noindex, follow" />
  
  <link rel="stylesheet" href="tailwind.min.css">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="toast.css">
  <style>
    body { font-family: 'Inter', sans-serif; }
    h1,h2,h3 { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="bg-gurmaoblack text-white overflow-x-hidden">

<script src="toast.js"></script>
<script type="module">
  // Import Supabase client
  import { supabase, updatePassword } from './supabase-client.js';

  // Check if this is a password reset callback
  const hashParams = new URLSearchParams(window.location.hash.substring(1));
  const type = hashParams.get('type');
  
  if (type !== 'recovery') {
    // Not a valid reset link
    document.getElementById('invalidLink').classList.remove('hidden');
    document.getElementById('resetForm').classList.add('hidden');
  }

  // Handle form submission
  document.getElementById('passwordResetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    
    // Validation
    if (newPassword.length < 8) {
      window.toast.show('❌ Heslo musí mít alespoň 8 znaků', 'error');
      return;
    }
    
    if (newPassword !== confirmPassword) {
      window.toast.show('❌ Hesla se neshodují', 'error');
      return;
    }
    
    // Update password
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Ukládám...';
    
    try {
      await updatePassword(newPassword);
      
      window.toast.show('✅ Heslo bylo změněno!', 'success');
      
      setTimeout(() => {
        window.location.href = 'feed.html';
      }, 2000);
      
    } catch (error) {
      console.error('Password reset error:', error);
      window.toast.show('❌ Chyba při změně hesla', 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Nastavit nové heslo';
    }
  });
</script>

<div class="min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full">
    
    <!-- Logo -->
    <div class="text-center mb-8">
      <a href="index.html" class="inline-block">
        <h1 class="text-5xl font-bold">
          <span class="text-white">GURMA</span><span class="text-gurmaogold">O</span>
        </h1>
      </a>
      <p class="text-white/60 mt-2">Obnov si přístup</p>
    </div>

    <!-- Reset Form -->
    <div id="resetForm" class="bg-white/5 backdrop-blur border border-white/10 rounded-3xl p-8">
      <h2 class="text-2xl font-bold mb-6">Nastav nové heslo</h2>
      
      <form id="passwordResetForm" class="space-y-6">
        <!-- New Password -->
        <div>
          <label for="newPassword" class="block text-sm font-medium mb-2">Nové heslo</label>
          <input
            type="password"
            id="newPassword"
            name="newPassword"
            required
            minlength="8"
            class="w-full px-4 py-3 rounded-2xl bg-white/10 border border-white/20 focus:border-gurmaogold focus:outline-none transition"
            placeholder="Alespoň 8 znaků"
          />
        </div>

        <!-- Confirm Password -->
        <div>
          <label for="confirmPassword" class="block text-sm font-medium mb-2">Potvrď heslo</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            required
            minlength="8"
            class="w-full px-4 py-3 rounded-2xl bg-white/10 border border-white/20 focus:border-gurmaogold focus:outline-none transition"
            placeholder="Zadej heslo znovu"
          />
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          id="submitBtn"
          class="w-full px-6 py-4 rounded-full bg-gurmaogold text-black font-semibold shadow-glow hover:scale-105 transition"
        >
          Nastavit nové heslo
        </button>
      </form>

      <!-- Password Requirements -->
      <div class="mt-6 p-4 rounded-2xl bg-white/5 border border-white/10">
        <p class="text-sm text-white/60 mb-2">Požadavky na heslo:</p>
        <ul class="text-sm text-white/80 space-y-1">
          <li>✓ Minimálně 8 znaků</li>
          <li>✓ Doporučujeme kombinaci písmen a čísel</li>
        </ul>
      </div>
    </div>

    <!-- Invalid Link Message -->
    <div id="invalidLink" class="hidden bg-white/5 backdrop-blur border border-white/10 rounded-3xl p-8 text-center">
      <div class="text-6xl mb-4">⚠️</div>
      <h2 class="text-2xl font-bold mb-4">Neplatný odkaz</h2>
      <p class="text-white/60 mb-6">Tento odkaz pro reset hesla je neplatný nebo vypršel.</p>
      <a href="login.html" class="inline-block px-6 py-3 rounded-full bg-gurmaogold text-black font-semibold hover:scale-105 transition">
        Zpět na přihlášení
      </a>
    </div>

    <!-- Back to Login -->
    <div class="mt-6 text-center">
      <a href="login.html" class="text-white/60 hover:text-gurmaogold transition">
        ← Zpět na přihlášení
      </a>
    </div>

  </div>
</div>

</body>
</html>
